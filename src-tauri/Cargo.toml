[package]
name = "app"
version = "1.0.1"
description = "CFA Master Clerk Entry Tool"
authors = ["Cat Fanciers' Association"]
license = "MIT"
repository = "https://github.com/cao117/CFAMasterClerkEntryToolA1.0"
edition = "2021"
rust-version = "1.77.2"

# Release profile: no debug symbols shipped to end users. Smaller binary, and a
# "normal-shaped" release PE lowers Windows Defender ML heuristic (!ml) scores.
[profile.release]
debug = false
strip = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.0", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
